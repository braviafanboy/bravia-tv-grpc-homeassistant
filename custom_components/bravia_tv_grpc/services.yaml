search:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    query:
      required: true
      example: "big buck bunny"
      selector:
        text:
    play:
      required: false
      default: false
      selector:
        boolean:
send_notification:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: notify
  fields:
    message:
      required: true
      example: "Laundry is done"
      selector:
        text:
    title:
      required: false
      example: "Home Assistant"
      selector:
        text:
    icon:
      required: false
      default: message
      selector:
        select:
          translation_key: notify_icon
          options:
            - none
            - message
            - alert
            - info
            - home
            - cast
            - speaker
            - remote
    duration:
      required: false
      example: 8
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: box
save_picture_profile:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    name:
      required: true
      example: "Calibrated (Professional, SDR)"
      selector:
        text:
restore_picture_profile:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    name:
      required: true
      example: "Calibrated (Professional, SDR)"
      selector:
        text:
    force:
      required: false
      default: false
      selector:
        boolean:
delete_picture_profile:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    name:
      required: true
      selector:
        text:
list_picture_profiles:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
compare_picture_profiles:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    name:
      required: true
      selector:
        text:
    other:
      required: false
      selector:
        text:
set_ambient_curves:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    curves:
      required: true
      example: '{"default": [9, 9, 11, 15, 25, 25], "modes": {"cinema": [5, 6, 8, 12, 20, 22]}}'
      selector:
        object:
get_ambient_curves:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player

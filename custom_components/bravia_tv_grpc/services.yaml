search:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: media_player
  fields:
    query:
      required: true
      example: "big buck bunny"
      selector:
        text:
    play:
      required: false
      default: false
      selector:
        boolean:
send_notification:
  target:
    entity:
      integration: bravia_tv_grpc
      domain: notify
  fields:
    message:
      required: true
      example: "Laundry is done"
      selector:
        text:
    title:
      required: false
      example: "Home Assistant"
      selector:
        text:
    icon:
      required: false
      default: message
      selector:
        select:
          translation_key: notify_icon
          options:
            - none
            - message
            - alert
            - info
            - home
            - cast
            - speaker
            - remote
    duration:
      required: false
      example: 8
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: seconds
          mode: box
save_picture_profile:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    name:
      required: true
      example: "Calibrated (Professional, SDR)"
      selector:
        text:
restore_picture_profile:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    name:
      required: true
      example: "Calibrated (Professional, SDR)"
      selector:
        text:
    force:
      required: false
      default: false
      selector:
        boolean:
delete_picture_profile:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    name:
      required: true
      selector:
        text:
list_picture_profiles:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
compare_picture_profiles:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    name:
      required: true
      selector:
        text:
    other:
      required: false
      selector:
        text:
set_ambient_curves:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    curves:
      required: true
      example: '{"default": [9, 9, 11, 15, 25, 25], "modes": {"cinema": [5, 6, 8, 12, 20, 22]}}'
      selector:
        object:
get_ambient_curves:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
show_dashboard:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc
    dashboard:
      required: true
      example: "lovelace/0"
      selector:
        text:
    mode:
      required: false
      default: full
      selector:
        select:
          translation_key: dashboard_mode
          options:
            - full
            - overlay
    position:
      required: false
      default: right
      selector:
        select:
          translation_key: dashboard_position
          options:
            - right
            - left
            - full
            - top_right
            - top_left
            - bottom_right
            - bottom_left
    size:
      required: false
      default: 40
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"
    duration:
      required: false
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
    kiosk:
      required: false
      default: true
      selector:
        boolean:
close_dashboard:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: bravia_tv_grpc

name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Keyed on pyproject.toml (distinct from the tests job's key, so the
          # two jobs don't share — and clobber — one cache entry).
          cache-dependency-path: pyproject.toml
      # Pin ruff: an unpinned install lets a new release add or tighten a rule
      # and turn CI red with no code change. Bump deliberately.
      - run: pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # requirements-dev.txt carries the runtime deps (grpcio/protobuf, kept in
      # step with manifest.json) plus pytest-homeassistant-custom-component,
      # which pulls HA for the config-flow/coordinator tests.
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q

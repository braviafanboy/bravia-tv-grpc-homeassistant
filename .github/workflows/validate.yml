name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  authors:
    name: Commit authors use a GitHub no-reply address
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check every commit in the push
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="HEAD~20..HEAD"
          fi
          bad=$(git log --format='%h %ae %ce' "$RANGE" 2>/dev/null | awk '$2 !~ /@users\.noreply\.github\.com$/ || $3 !~ /@users\.noreply\.github\.com$/' || true)
          if [ -n "$bad" ]; then
            echo "Commits with a personal identity (use the project no-reply address):"; echo "$bad"; exit 1
          fi
          echo "ok"

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # Keyed on its own requirements file (distinct from the tests job's
          # key, so the two jobs don't share — and clobber — one cache entry).
          cache-dependency-path: requirements-lint.txt
      # ruff is pinned in requirements-lint.txt: an unpinned install lets a new
      # release add or tighten a rule and turn CI red with no code change.
      # Dependabot proposes the bumps.
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: ruff format --check .

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the newest Python for the oldest supported HA (2025.11);
        # HA 2026.3+ requires 3.14, so 3.14 tests current HA.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # requirements-dev.txt carries the runtime deps (grpcio/protobuf, kept in
      # step with manifest.json) plus pytest-homeassistant-custom-component,
      # which pulls HA for the config-flow/coordinator tests.
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -q

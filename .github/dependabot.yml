version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These floors are the oldest versions the integration works with, and
      # the Home Assistant release under test decides the versions actually
      # installed (its package constraints; see the tests job). Raising a
      # floor can only make an install on an older Home Assistant
      # unresolvable. protobuf's and grpcio's floors are also the manifest's
      # minimums (they match the generated pb2 code); change them by hand
      # with that.
      - dependency-name: aiohttp
      - dependency-name: cryptography
      - dependency-name: protobuf
      - dependency-name: pytest
      - dependency-name: grpcio
      # Sets the generated code's minimum versions (requirements-proto.txt).
      - dependency-name: grpcio-tools

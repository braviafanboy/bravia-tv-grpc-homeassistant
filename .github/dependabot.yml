version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # These are pinned by pytest-homeassistant-custom-component (i.e. by the
      # Home Assistant release under test), so raising our floor can only make
      # the install unresolvable. protobuf's floor is also the manifest's
      # minimum (matches the generated pb2 code); change it by hand with that.
      - dependency-name: aiohttp
      - dependency-name: cryptography
      - dependency-name: protobuf
      - dependency-name: pytest
      # grpcio's floor is the manifest minimum and must stay installable
      # against HA's pinned grpcio. grpcio-tools sets the generated code's
      # minimum versions (see requirements-dev.txt).
      - dependency-name: grpcio
      - dependency-name: grpcio-tools
